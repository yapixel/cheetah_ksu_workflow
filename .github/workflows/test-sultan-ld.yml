name: Test Sultan Kernel Build (LD Optimization)

on:
  workflow_dispatch:
    inputs:
      lto_mode:
        description: 'LTO Optimization Strategy'
        required: true
        type: choice
        options:
          - 'no_ipa_pta'
          - 'disable_lto'
          - 'stock_lto'
        default: 'no_ipa_pta'
      disable_btf:
        description: 'Disable BTF debug info generation (Skip pahole -J to save ~40s)'
        required: true
        type: boolean
        default: false
      hook_mode:
        description: 'Hook Mode'
        required: true
        type: choice
        options:
          - 'manual'
          - 'lsm'
        default: 'manual'
      enable_susfs:
        description: 'Enable SuSFS'
        required: true
        type: boolean
        default: true
      ksu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'master'
          - 'staging'
        default: 'master'
      use_ccache:
        description: 'Enable Ccache'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.lto_mode }}-${{ github.event.inputs.hook_mode }}
  cancel-in-progress: false

env:
  SULTAN_SOURCE: https://github.com/kerneltoast/android_kernel_google_tensynos
  SULTAN_TAG: 20260314
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_REPO_BRANCH: sultan-shiba-susfs-minimal
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_COMPILERCHECK: "content"
  CCACHE_NOHASHDIR: "true"
  CCACHE_TEMPDIR: "/dev/shm/ccache-temp"

jobs:
  test_build:
    name: Test Sultan Build (${{ github.event.inputs.lto_mode }}, BTF=${{ !github.event.inputs.disable_btf }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Fast Git Protocol
        run: |
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/2
          git config --global core.compression 0

      - name: Set up build environment and ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev)
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            mkdir -p ${{ github.workspace }}/.ccache
            mkdir -p /dev/shm/ccache-temp
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" >> $GITHUB_ENV
            echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSTYPE=zstd" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSLEVEL=1" >> $GITHUB_ENV
            echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
            echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
            echo "CCACHE_TEMPDIR=/dev/shm/ccache-temp" >> $GITHUB_ENV
          else
            echo "USE_CCACHE=0" >> $GITHUB_ENV
          fi

      - name: Restore Cache
        id: cache-restore
        uses: ./.github/actions/restore-cache-retry
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.event.inputs.hook_mode }}-${{ github.event.inputs.enable_susfs }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.event.inputs.hook_mode }}-${{ github.event.inputs.enable_susfs }}-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.event.inputs.hook_mode }}-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.hook_mode }}-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-

      - name: Setup Ccache Configurations
        if: github.event.inputs.use_ccache != 'false'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p /dev/shm/ccache-temp
          ccache -M 10G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o temporary_dir=/dev/shm/ccache-temp \
            -o base_dir="${{ github.workspace }}"
          ccache -z

      - name: Install ARM Toolchain
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "⚡ Cache miss: Downloading ARM GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }} with aria2c..."
            BASE_URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${{ env.ARM_TOOLCHAIN_VERSION }}/"
            ARCHIVE="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE}" -o arm-toolchain.tar.xz || { echo "❌ Failed to download toolchain"; exit 1; }
            tar -xf arm-toolchain.tar.xz || { echo "❌ Failed to extract toolchain"; exit 1; }
            rm -f arm-toolchain.tar.xz
          else
            echo "✅ ARM Toolchain restored from Action Cache!"
          fi
          
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "❌ ERROR: Toolchain directory not found after installation: $TOOLCHAIN_DIR"
            exit 1
          fi
          
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "GCC_VER=$($TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-gcc --version | head -n1 | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Clone Source
        run: |
          echo "🔄 Cloning source repositories..."
          git clone --depth=1 --single-branch "${{ env.SULTAN_SOURCE }}" -b "${{ env.SULTAN_TAG }}" sultan &
          PID_SULTAN=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3 &
          PID_AK3=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches &
          PID_PATCHES=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh &
          PID_SCRIPTS=$!
          
          wait $PID_SULTAN || { echo "❌ Failed to clone sultan"; exit 1; }
          wait $PID_AK3 || { echo "❌ Failed to clone AK3"; exit 1; }
          wait $PID_PATCHES || { echo "❌ Failed to clone kernel_patches"; exit 1; }
          wait $PID_SCRIPTS || { echo "❌ Failed to clone sh"; exit 1; }
          
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu || { echo "❌ Failed to clone susfs4ksu"; exit 1; }
          fi
          
          echo "✅ All repositories cloned successfully"

      - name: Metadata
        id: meta
        run: |
          set -e
          S_TAG=$(git -C sultan describe --tags --exact-match 2>/dev/null || git -C sultan tag --sort=-committerdate 2>/dev/null | head -n1)
          if [ -z "$S_TAG" ]; then
            S_TAG="${{ env.SULTAN_TAG }}"
          fi
          
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" 2>&1) || K_VER="unknown"
          K_VER="${K_VER// /}"
          
          KERNEL_VER=$(make -C sultan -s kernelversion 2>/dev/null || true)
          if [ -z "$KERNEL_VER" ]; then
            V_MAJOR=$(grep -E '^VERSION =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_PATCH=$(grep -E '^PATCHLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_SUB=$(grep -E '^SUBLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            KERNEL_VER="${V_MAJOR}.${V_PATCH}${V_SUB:+.${V_SUB}}"
          fi
          
          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          
          echo "======================================"
          echo "🏷️ Sultan Tag: $S_TAG"
          echo "🐧 Kernel Base: Linux $KERNEL_VER"
          echo "🔧 LTO Mode: ${{ github.event.inputs.lto_mode }}"
          echo "🛑 Disable BTF: ${{ github.event.inputs.disable_btf }}"
          echo "======================================"

      - name: KSU Base & Sultan Patches
        working-directory: sultan
        run: |
          set -e
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          SETUP_SCRIPT="ksu_setup.sh"
          curl -LSs --max-time 30 "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/$KSU_BRANCH/kernel/setup.sh" -o "$SETUP_SCRIPT"
          chmod +x "$SETUP_SCRIPT"
          ./"$SETUP_SCRIPT" "$KSU_BRANCH"
          rm -f "$SETUP_SCRIPT"
          
          KSU_COMMIT=$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo "")
          echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
          
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
            "../kernel_patches/sultan/0001-modify-noinline.patch"
          )
          for patch in "${PATCHES[@]}"; do
            [ -f "$patch" ] && patch -p1 < "$patch"
          done

      - name: Apply Hook Patches
        if: github.event.inputs.hook_mode == 'manual'
        working-directory: sultan
        run: |
          set -e
          echo "📋 Applying manual security hooks patches..."
          MANUAL_PATCHES=(
            "${{ github.workspace }}/.github/patches/manual-security-hooks-v2.0.patch"
            "${{ github.workspace }}/.github/patches/scope-min-manual-hooks-v2.3.patch"
          )
          for patch in "${MANUAL_PATCHES[@]}"; do
            [ -f "$patch" ] && patch -p1 -l < "$patch"
          done

      - name: Apply SuSFS Patches
        if: github.event.inputs.enable_susfs == 'true'
        working-directory: sultan
        run: |
          set -e
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          bash "${{ github.workspace }}/.github/scripts/susfs_deinlined.sh" "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          patch -p1 < deinlined.patch
          
          if [ "${{ github.event.inputs.hook_mode }}" = "lsm" ]; then
            patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/55_try_umount_for_susfs.patch" || true
          fi
          
          cd KernelSU
          patch -p1 -l --fuzz=3 < <(curl -fsSL "https://github.com/midori01/KernelSU/commit/xx.patch")
          cd ..

      - name: Apply LTO Optimization
        working-directory: sultan
        run: |
          set -e
          LTO_STRATEGY="${{ github.event.inputs.lto_mode }}"
          echo "🔧 Applying LTO strategy: $LTO_STRATEGY"
          
          # Ensure GCC LTO uses all available vCPUs instead of falling back to 1 core on jobserver failure
          NPROC=$(nproc --all)
          sed -i "s/-flto=jobserver/-flto=$NPROC/g" Makefile

          if [ "$LTO_STRATEGY" = "no_ipa_pta" ]; then
            echo "⚡ Removing -fipa-pta from sultan/Makefile (retaining LTO, skipping expensive pointer analysis)..."
            sed -i 's/-fipa-pta //g' Makefile
            echo "Makefile CC_FLAGS_LTO:"
            grep "CC_FLAGS_LTO" Makefile
          elif [ "$LTO_STRATEGY" = "disable_lto" ]; then
            echo "⚡ Will disable CONFIG_LTO_GCC after defconfig generation."
          else
            echo "ℹ️ Retaining stock Sultan LTO settings (with -fipa-pta, parallel LTO enabled)."
          fi

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "⚙️ Generating gs201_defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          hook_mode: "${{ github.event.inputs.hook_mode }}"
          enable_susfs: "${{ github.event.inputs.enable_susfs }}"

      - name: Post-process Defconfig (LTO & BTF)
        working-directory: sultan
        run: |
          set -e
          LTO_STRATEGY="${{ github.event.inputs.lto_mode }}"
          if [ "$LTO_STRATEGY" = "disable_lto" ]; then
            echo "⚡ Disabling CONFIG_LTO_GCC in out/.config..."
            sed -i 's/CONFIG_LTO_GCC=y/CONFIG_LTO_GCC=n/' out/.config
            echo "CONFIG_LTO_NONE=y" >> out/.config
          fi
          
          if [ "${{ github.event.inputs.disable_btf }}" = "true" ]; then
            echo "⚡ Disabling CONFIG_DEBUG_INFO_BTF in out/.config..."
            sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/' out/.config
          fi

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "🔧 Finalizing defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel & Benchmark
        id: build_kernel
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: test-user
          KBUILD_BUILD_HOST: test-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -e
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            CC="ccache ${{ env.TOOLCHAIN_PATH }}gcc"
          else
            CC="${{ env.TOOLCHAIN_PATH }}gcc"
          fi
          
          echo "🚀 Starting kernel compilation..."
          echo "Compiler: $CC"
          echo "Threads: $(nproc --all)"
          
          START_TIME=$(date +%s)
          
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))
          
          echo "build_duration_sec=$DURATION" >> "$GITHUB_OUTPUT"
          echo "build_duration_fmt=${MIN}m ${SEC}s" >> "$GITHUB_OUTPUT"
          
          echo "======================================"
          echo "✅ Compilation & Linking completed in: ${MIN}m ${SEC}s ($DURATION seconds)"
          echo "======================================"
          ls -lh out/arch/arm64/boot/Image.lz4

      - name: Ccache Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats ==="
          ccache -s

      - name: Package AnyKernel3
        run: |
          set -e
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          
          DATE=$(date +'%y%m%d')
          LTO_TAG="${{ github.event.inputs.lto_mode }}"
          BTF_TAG="${{ github.event.inputs.disable_btf == 'true' && '-noBTF' || '' }}"
          ZIP_NAME="TEST_Sultan_${LTO_TAG}_${{ github.event.inputs.hook_mode }}${BTF_TAG}-${DATE}.zip"
          
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          mkdir -p output
          mv "$ZIP_NAME" output/
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-kernel-${{ github.event.inputs.lto_mode }}
          path: output/*.zip
          retention-days: 3

      - name: Save Cache
        if: always() && github.event.inputs.use_ccache != 'false'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.event.inputs.hook_mode }}-${{ github.event.inputs.enable_susfs }}-${{ github.run_id }}

      - name: Benchmark Summary
        if: always()
        run: |
          echo "### ⏱️ Sultan Kernel Link & Compile Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **LTO Strategy** | \`${{ github.event.inputs.lto_mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **BTF Generation** | \`${{ github.event.inputs.disable_btf == 'true' && 'Disabled' || 'Enabled' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hook Mode** | \`${{ github.event.inputs.hook_mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SuSFS Enabled** | \`${{ github.event.inputs.enable_susfs }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Compile & Link Duration** | **\`${{ steps.build_kernel.outputs.build_duration_fmt || 'Failed' }}\`** (\`${{ steps.build_kernel.outputs.build_duration_sec || 0 }}s\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Output Artifact** | \`${{ env.zip_name }}\` |" >> $GITHUB_STEP_SUMMARY
